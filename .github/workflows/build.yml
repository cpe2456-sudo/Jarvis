name: Crear APK de Jarvis
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Crear proyecto
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/speech-recognition@7
          echo '{"appId":"com.jarvis.asistente","appName":"Jarvis","webDir":"www","server":{"androidScheme":"https"},"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="com.android.alarm.permission.SET_ALARM"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' $M
          sed -i 's#</application>#<service android:name=".JarvisService" android:exported="false" android:foregroundServiceType="microphone"/></application>#' $M
          D=android/app/src/main/java/com/jarvis/asistente
          cat > $D/AppLauncherPlugin.java <<'EOF'
          package com.jarvis.asistente;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.text.Normalizer;
          import java.util.List;
          import java.util.Locale;

          @CapacitorPlugin(name = "AppLauncher")
          public class AppLauncherPlugin extends Plugin {

            private static String norm(String s) {
              String t = Normalizer.normalize(s.toLowerCase(Locale.ROOT), Normalizer.Form.NFD);
              return t.replaceAll("[^a-z0-9 ]", "").trim();
            }

            @PluginMethod
            public void open(PluginCall call) {
              String q = norm(call.getString("name", ""));
              JSObject r = new JSObject();
              if (q.isEmpty()) {
                r.put("ok", false);
                call.resolve(r);
                return;
              }
              PackageManager pm = getContext().getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN, null);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
              ResolveInfo best = null;
              int score = 0;
              for (ResolveInfo ri : list) {
                String label = norm(ri.loadLabel(pm).toString());
                if (label.isEmpty()) continue;
                int sc = 0;
                if (label.equals(q)) sc = 3;
                else if (label.startsWith(q) || (label.length() > 2 && q.startsWith(label))) sc = 2;
                else if (label.contains(q) || (label.length() > 2 && q.contains(label))) sc = 1;
                if (sc > score) {
                  score = sc;
                  best = ri;
                }
              }
              if (best == null) {
                r.put("ok", false);
                call.resolve(r);
                return;
              }
              Intent i = pm.getLaunchIntentForPackage(best.activityInfo.packageName);
              if (i == null) {
                r.put("ok", false);
                call.resolve(r);
                return;
              }
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              r.put("ok", true);
              r.put("label", best.loadLabel(pm).toString());
              call.resolve(r);
            }
          }
          EOF
          cat > $D/Apps.java <<'EOF'
          package com.jarvis.asistente;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import java.text.Normalizer;
          import java.util.List;
          import java.util.Locale;

          public class Apps {

            static String norm(String s) {
              String t = Normalizer.normalize(s.toLowerCase(Locale.ROOT), Normalizer.Form.NFD);
              return t.replaceAll("[^a-z0-9 ]", "").trim();
            }

            static String launch(Context c, String name) {
              String q = norm(name == null ? "" : name);
              if (q.isEmpty()) return null;
              PackageManager pm = c.getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN, null);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
              ResolveInfo best = null;
              int score = 0;
              for (ResolveInfo ri : list) {
                String label = norm(ri.loadLabel(pm).toString());
                if (label.isEmpty()) continue;
                int sc = 0;
                if (label.equals(q)) sc = 3;
                else if (label.startsWith(q) || (label.length() > 2 && q.startsWith(label))) sc = 2;
                else if (label.contains(q) || (label.length() > 2 && q.contains(label))) sc = 1;
                if (sc > score) {
                  score = sc;
                  best = ri;
                }
              }
              if (best == null) return null;
              Intent i = pm.getLaunchIntentForPackage(best.activityInfo.packageName);
              if (i == null) return null;
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              c.startActivity(i);
              return best.loadLabel(pm).toString();
            }
          }
          EOF
          cat > $D/BgPlugin.java <<'EOF'
          package com.jarvis.asistente;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Bg")
          public class BgPlugin extends Plugin {

            @PluginMethod
            public void start(PluginCall call) {
              Context c = getContext();
              JSObject r = new JSObject();
              boolean needNotif = Build.VERSION.SDK_INT >= 33
                  && ContextCompat.checkSelfPermission(c, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED;
              if (needNotif) {
                try {
                  ActivityCompat.requestPermissions(getActivity(), new String[] {Manifest.permission.POST_NOTIFICATIONS}, 77);
                } catch (Exception e) {
                }
              }
              try {
                ContextCompat.startForegroundService(c, new Intent(c, JarvisService.class));
                r.put("started", true);
              } catch (Exception e) {
                r.put("started", false);
                r.put("error", String.valueOf(e.getMessage()));
              }
              boolean overlay = Settings.canDrawOverlays(c);
              PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
              boolean battery = pm != null && pm.isIgnoringBatteryOptimizations(c.getPackageName());
              r.put("needNotif", needNotif);
              r.put("needOverlay", !overlay);
              r.put("needBattery", !battery);
              if (!needNotif) {
                Intent i = null;
                if (!overlay) {
                  i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + c.getPackageName()));
                } else if (!battery) {
                  i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + c.getPackageName()));
                }
                if (i != null) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                    c.startActivity(i);
                  } catch (Exception e) {
                  }
                }
              }
              call.resolve(r);
            }

            @PluginMethod
            public void stop(PluginCall call) {
              Context c = getContext();
              c.stopService(new Intent(c, JarvisService.class));
              call.resolve();
            }

            @PluginMethod
            public void setCfg(PluginCall call) {
              SharedPreferences p = getContext().getSharedPreferences("jv", Context.MODE_PRIVATE);
              String k = call.getString("key", "");
              String m = call.getString("mem", "[]");
              p.edit().putString("key", k == null ? "" : k).putString("mem", m == null ? "[]" : m).apply();
              call.resolve();
            }

            @PluginMethod
            public void getCfg(PluginCall call) {
              SharedPreferences p = getContext().getSharedPreferences("jv", Context.MODE_PRIVATE);
              JSObject r = new JSObject();
              r.put("mem", p.getString("mem", "[]"));
              call.resolve(r);
            }

            @PluginMethod
            public void take(PluginCall call) {
              JSObject r = new JSObject();
              r.put("pending", JarvisService.hasPending);
              r.put("cmd", JarvisService.pending == null ? "" : JarvisService.pending);
              JarvisService.hasPending = false;
              JarvisService.pending = "";
              call.resolve(r);
            }
          }
          EOF
          cat > $D/JarvisService.java <<'EOF'
          package com.jarvis.asistente;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.AlarmClock;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.Normalizer;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class JarvisService extends Service {

            static JarvisService inst = null;
            static volatile boolean paused = false;
            static volatile boolean hasPending = false;
            static volatile String pending = "";

            private static final Pattern WAKE =
                Pattern.compile("\\b(jarvis|yarvis|yarbis|jarbis|charvis|jarvi|yarvi|jervis|yervis)\\b");

            private final Handler h = new Handler(Looper.getMainLooper());
            private final Runnable loop = this::startListening;
            private final Runnable finish = this::finishTurn;
            private SpeechRecognizer sr = null;
            private Intent recIntent;
            private SharedPreferences prefs;
            private TextToSpeech tts;
            private boolean ttsReady = false;
            private boolean running = false;
            private volatile boolean busy = false;
            private boolean cmdMode = false;
            private boolean listenAfter = false;
            private final ArrayList<String> hist = new ArrayList<String>();

            static class Res {
              String reply = "Hecho, señor.";
              JSONArray acts = null;
              boolean listen = false;
            }

            static String norm(String s) {
              String t = Normalizer.normalize(s.toLowerCase(Locale.ROOT), Normalizer.Form.NFD);
              return t.replaceAll("\\p{M}", "");
            }

            static void setPaused(final boolean p) {
              paused = p;
              final JarvisService s = inst;
              if (s == null) return;
              s.h.post(new Runnable() {
                public void run() {
                  if (p) {
                    s.h.removeCallbacks(s.loop);
                    s.destroyRec();
                  } else {
                    s.later(600);
                  }
                }
              });
            }

            @Override
            public void onCreate() {
              super.onCreate();
              inst = this;
              prefs = getSharedPreferences("jv", MODE_PRIVATE);
              channels();
              try {
                Notification n = ongoing();
                if (Build.VERSION.SDK_INT >= 29) {
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                } else {
                  startForeground(1, n);
                }
              } catch (Exception e) {
                stopSelf();
                return;
              }
              running = true;
              tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS) {
                    tts.setLanguage(new Locale("es", "ES"));
                    tts.setPitch(0.85f);
                    tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      public void onStart(String id) {}
                      public void onDone(String id) {
                        h.post(finish);
                      }
                      public void onError(String id) {
                        h.post(finish);
                      }
                    });
                    ttsReady = true;
                  }
                }
              });
              recIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
              recIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
              recIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-ES");
              recIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
              h.post(loop);
            }

            @Override
            public int onStartCommand(Intent i, int flags, int startId) {
              if (i != null && "STOP".equals(i.getAction())) {
                stopSelf();
              }
              return START_NOT_STICKY;
            }

            @Override
            public void onDestroy() {
              running = false;
              h.removeCallbacksAndMessages(null);
              destroyRec();
              try {
                if (tts != null) tts.shutdown();
              } catch (Exception e) {
              }
              inst = null;
              super.onDestroy();
            }

            @Override
            public IBinder onBind(Intent i) {
              return null;
            }

            void later(long ms) {
              if (!running) return;
              h.removeCallbacks(loop);
              h.postDelayed(loop, ms);
            }

            void destroyRec() {
              if (sr != null) {
                try {
                  sr.cancel();
                  sr.destroy();
                } catch (Exception e) {
                }
                sr = null;
              }
            }

            void startListening() {
              if (!running || paused || busy) return;
              try {
                if (sr == null) {
                  sr = SpeechRecognizer.createSpeechRecognizer(this);
                  sr.setRecognitionListener(new Listener());
                }
                sr.startListening(recIntent);
              } catch (Exception e) {
                destroyRec();
                later(2500);
              }
            }

            void wake(String rest) {
              destroyRec();
              if (rest.length() > 2) {
                process(rest);
              } else {
                speak("Mande señor", true);
              }
            }

            void speak(String text, boolean la) {
              listenAfter = la;
              busy = true;
              if (text == null || text.trim().isEmpty()) text = "Hecho, señor.";
              if (!ttsReady) {
                h.post(finish);
                return;
              }
              tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jv" + System.nanoTime());
            }

            void finishTurn() {
              busy = false;
              if (listenAfter) {
                listenAfter = false;
                cmdMode = true;
                later(150);
              } else {
                cmdMode = false;
                later(300);
              }
            }

            void process(final String text) {
              busy = true;
              destroyRec();
              hist.add("Señor: " + text);
              while (hist.size() > 12) hist.remove(0);
              if (prefs.getString("key", "").isEmpty()) {
                speak("Necesito su clave de API, señor. Abra Jarvis y péguela en el engranaje.", false);
                return;
              }
              new Thread(new Runnable() {
                public void run() {
                  final Res r = new Res();
                  try {
                    String raw = callAI();
                    JSONObject o;
                    try {
                      o = new JSONObject(raw.replace("```json", "").replace("```", "").trim());
                    } catch (Exception pe) {
                      o
