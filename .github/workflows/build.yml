name: Crear APK de Jarvis
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Crear proyecto
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/speech-recognition@7
          echo '{"appId":"com.jarvis.asistente","appName":"Jarvis","webDir":"www","server":{"androidScheme":"https"},"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
          D=android/app/src/main/java/com/jarvis/asistente
          cat > $D/AppLauncherPlugin.java <<'EOF'
          package com.jarvis.asistente;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.text.Normalizer;
          import java.util.List;
          import java.util.Locale;

          @CapacitorPlugin(name = "AppLauncher")
          public class AppLauncherPlugin extends Plugin {

            private static String norm(String s) {
              String t = Normalizer.normalize(s.toLowerCase(Locale.ROOT), Normalizer.Form.NFD);
              return t.replaceAll("[^a-z0-9 ]", "").trim();
            }

            @PluginMethod
            public void open(PluginCall call) {
              String q = norm(call.getString("name", ""));
              JSObject r = new JSObject();
              if (q.isEmpty()) {
                r.put("ok", false);
                call.resolve(r);
                return;
              }
              PackageManager pm = getContext().getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN, null);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
              ResolveInfo best = null;
              int score = 0;
              for (ResolveInfo ri : list) {
                String label = norm(ri.loadLabel(pm).toString());
                if (label.isEmpty()) continue;
                int sc = 0;
                if (label.equals(q)) sc = 3;
                else if (label.startsWith(q) || (label.length() > 2 && q.startsWith(label))) sc = 2;
                else if (label.contains(q) || (label.length() > 2 && q.contains(label))) sc = 1;
                if (sc > score) {
                  score = sc;
                  best = ri;
                }
              }
              if (best == null) {
                r.put("ok", false);
                call.resolve(r);
                return;
              }
              Intent i = pm.getLaunchIntentForPackage(best.activityInfo.packageName);
              if (i == null) {
                r.put("ok", false);
                call.resolve(r);
                return;
              }
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              r.put("ok", true);
              r.put("label", best.loadLabel(pm).toString());
              call.resolve(r);
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.jarvis.asistente;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AppLauncherPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Jarvis ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
